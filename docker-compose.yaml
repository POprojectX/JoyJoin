version: "3.9"

networks:
  JoyJoin:
    driver: bridge

services:
  db-user-service:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: joyjoin_db
    ports:
      - "5433:5432"
    networks:
      - JoyJoin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U user -d joyjoin_db
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:latest
    container_name: infr-nginx
    ports:
      - "8090:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - JoyJoin
    depends_on:
      - user-service
    restart: unless-stopped

  user-service:
    build:
      context: ./go-services/user-service
      dockerfile: Dockerfile
    container_name: backend-user-service
    environment:
      - DB_HOST=db-user-service
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=joyjoin_db
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-prod}
    depends_on:
      db-user-service:
        condition: service_healthy
    networks:
      - JoyJoin
    restart: on-failure

volumes:
  postgres_data:
