version: "3.9"

networks:
  JoyJoin:
    driver: bridge

services:
  db-user-service:
    image: postgres:15-alpine
    container_name: user-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: joyjoin_db
    ports:
      - "5432:5432"
    networks:
      - JoyJoin
    volumes:
      - postgres_data:/var/lib/postgresql/data
  nginx:
    image: nginx:latest
    container_name: infr-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - JoyJoin

  user-service:
    build: ./services/user-service
    container_name: backend-user-service
    environment:
      - DB_HOST=db-user-service
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=joyjoin_db
      - DB_PORT=5432
    depends_on:
      - db-user-service
    networks:
      - JoyJoin

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - JoyJoin

volumes:
  postgres_data:
