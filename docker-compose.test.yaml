version: "3.9"

services:
  test-db:
    image: postgres:15-alpine
    container_name: user-db-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: joyjoin_test_db
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d joyjoin_test_db"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 3s

  test-runner:
    build:
      context: ./go-services/user-service
      dockerfile: Dockerfile.test
    container_name: test-runner
    environment:
      - DB_HOST=test-db
      - DB_USER=test
      - DB_PASSWORD=test
      - DB_NAME=joyjoin_test_db
      - DB_PORT=5432
    depends_on:
      test-db:
        condition: service_healthy
